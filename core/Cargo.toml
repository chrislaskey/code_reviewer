[package]
name = "code_reviewer_core"
version = "0.1.0"
edition = "2021"

[dependencies]
globset = "0.4.20"
indexmap = { version = "2.14.2", features = ["serde"] }
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = { version = "1.1.8", features = ["preserve_order"] }
tree-sitter = "0.27.1"
tree-sitter-elixir = "0.3.5"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
