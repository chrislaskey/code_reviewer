# Which files are the template's, see docs/design/template-and-apps.md.
#
# framework: the template's machinery. An app extends it from its own
#   files, or changes it in the template and merges it back here. Each is
#   checked against framework.lock by `cargo test --workspace`; one an app
#   changes on purpose is declared below as a [[divergence]], with why.
# seams: files every app edits to add a feature; never checked.
# examples: features that show the patterns, the app's to replace or
#   delete; never checked.
# Anything else is the app's own. Seams and examples take precedence over
# framework. Globs are from the root: * within a folder, ** across them.

framework = [
    "bin/**",
    "framework_check/**",

    "core/src/lib.rs",
    "core/src/database.rs",
    "core/src/deployment.rs",
