[package]
name = "framework_check"
description = "Checks an app's copy of the template's own files against framework.lock, see docs/design/template-and-apps.md"
version.workspace = true
edition.workspace = true

[dependencies]
glob = "0.3"
ignore = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
toml = "1"

[dev-dependencies]
tempfile = "3"
