[package]
name = "code_reviewer"
version = "0.1.0"
description = "Code Reviewer: review what a change did, and run Claude Code sessions in tmux"
edition = "2024"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name.
name = "code_reviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
code_reviewer_core = { path = "../../core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
log = "0.4"
env_logger = "0.11"
