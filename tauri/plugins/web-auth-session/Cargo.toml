[package]
name = "tauri-plugin-web-auth-session"
description = "Starter Pack's ASWebAuthenticationSession for the iPhone app: the system's sign-in sheet over the app, closed by a redirect to the app's scheme"
version.workspace = true
edition.workspace = true
links = "tauri-plugin-web-auth-session"
exclude = ["/ios/.build", "/ios/.tauri"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
thiserror = { workspace = true }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
