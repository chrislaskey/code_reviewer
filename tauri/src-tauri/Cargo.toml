[package]
name = "code_reviewer"
version = "0.1.0"
description = "Code Reviewer: review what a change did, and run Claude Code sessions in tmux"
edition = "2024"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name.
name = "code_reviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
code_reviewer_core = { path = "../../core" }
code_reviewer_server = { path = "../../server" }
code_reviewer_client = { path = "../../client" }
tauri = { version = "2", features = [] }
env_logger = "0.11"
log = "0.4"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
tauri-plugin-opener = "2"
url = "2"
tokio = { version = "1.54.1", features = ["time"] }

# The desktop shows notifications itself; a phone gets them pushed by
# Apple, which needs this plugin's push registration (decision 30).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-notification = "2"

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-notifications = { version = "0.4.6", default-features = false, features = ["push-notifications"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
